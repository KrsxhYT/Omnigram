name: Omnigram ALL-IN-ONE fixed

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/omnigram_all_in_one.py'
      - '.github/workflows/omnigram-all-in-one.yml'

permissions:
  contents: write

concurrency:
  group: omnigram-all-in-one
  cancel-in-progress: true

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply all patches
        run: |
          set -euo pipefail
          python3 tools/omnigram_all_in_one.py

      - name: Commit only Java sources
        run: |
          set -euo pipefail
          git config user.name "omnigram-bot"
          git config user.email "bot@omnigram.local"
          # Never stage workflow files (GITHUB_TOKEN cannot update them)
          git add TMessagesProj/ || true
          git reset HEAD -- .github 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "ALL-IN-ONE: calc fix, deleted 70%+dustbin, pin OfficialOmnigram, verified channels"
            git push origin HEAD:master
          fi
