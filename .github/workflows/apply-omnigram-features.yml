name: Apply Omnigram features patches

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apply_omnigram_features.py'
      - '.github/workflows/apply-omnigram-features.yml'

permissions:
  contents: write

concurrency:
  group: omnigram-features
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run feature patcher
        run: |
          set -euo pipefail
          python3 tools/apply_omnigram_features.py
          echo "--- verify ---"
          grep -n "userOrChatIdRow\|OmnigramVerified\|0xFF38506A" TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java | head -20 || true
          grep -n "9999\|DevelopersActivity" TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java | head -10 || true
          grep -n "✎" TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java | head -5 || true

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "omnigram-bot"
          git config user.email "bot@omnigram.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "UI: Profile User ID + Registered, Developers settings, verified badge, edited pencil"
            git push origin HEAD:master
          fi
