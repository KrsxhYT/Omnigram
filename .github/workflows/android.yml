name: OmniGram Android Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Install Android build components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Use my Firebase google-services.json
        run: |
          test -f TMessagesProj/google-services.json || (echo "TMessagesProj/google-services.json not found" && exit 1)
          cp TMessagesProj/google-services.json TMessagesProj_App/google-services.json
          echo "Packages in google-services.json:"
          grep -o '"package_name": *"[^"]*"' TMessagesProj_App/google-services.json

      - name: Restore private signing key and inject Telegram API credentials
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib

          encoded = os.environ.get("RELEASE_KEYSTORE_BASE64", "").strip()
          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()

          if not encoded:
              raise SystemExit("Missing GitHub secret: RELEASE_KEYSTORE_BASE64")
          if not api_id.isdigit():
              raise SystemExit("TELEGRAM_API_ID is missing or is not numeric")
          if not api_hash:
              raise SystemExit("Missing GitHub secret: TELEGRAM_API_HASH")

          key_path = pathlib.Path("TMessagesProj/config/release.keystore")
          key_path.parent.mkdir(parents=True, exist_ok=True)
          key_path.write_bytes(base64.b64decode(encoded, validate=True))

          build_vars = pathlib.Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          source = build_vars.read_text(encoding="utf-8")

          old_id = 'public static int APP_ID = Integer.parseInt(System.getenv("TELEGRAM_API_ID"));'
          old_hash = 'public static String APP_HASH = System.getenv("TELEGRAM_API_HASH");'
          if source.count(old_id) != 1 or source.count(old_hash) != 1:
              raise SystemExit("Could not safely inject API credentials into BuildVars.java; source format did not match")

          source = source.replace(old_id, f'public static int APP_ID = {api_id};')
          source = source.replace(old_hash, 'public static String APP_HASH = ' + json.dumps(api_hash) + ';')

          build_vars.write_text(source, encoding="utf-8")
          print("Private signing key restored and API credentials injected.")
          PY

      - name: Build signed OmniGram release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000"
        run: |
          test -n "$RELEASE_STORE_PASSWORD" || (echo "Missing RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$RELEASE_KEY_PASSWORD" || (echo "Missing RELEASE_KEY_PASSWORD" && exit 1)
          test -n "$RELEASE_KEY_ALIAS" || (echo "Missing RELEASE_KEY_ALIAS" && exit 1)
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace --max-workers=2 \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" \
            -Dorg.gradle.internal.http.connectionTimeout=180000 \
            -Dorg.gradle.internal.http.socketTimeout=180000

      - name: Upload OmniGram release APK
        uses: actions/upload-artifact@v4
        with:
          name: omnigram-release
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
          retention-days: 14
