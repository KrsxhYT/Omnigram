name: Omnigram Android Build

# The one and only workflow. Builds a signed release APK on every push to master
# (or manually from the Actions tab) and uploads it as an artifact.
#
# Repo secrets used:
#   TELEGRAM_API_ID, TELEGRAM_API_HASH            (required: from my.telegram.org)
#   RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD,
#   RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD       (optional: your own signing key;
#                                                  a temporary key is generated if missing)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omnigram-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Telegram API credentials
        run: |
          [[ "$TELEGRAM_API_ID" =~ ^[0-9]+$ ]] || { echo "::error::Add repo secret TELEGRAM_API_ID (numeric)"; exit 1; }
          [ -n "$TELEGRAM_API_HASH" ] || { echo "::error::Add repo secret TELEGRAM_API_HASH"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Firebase config
        run: |
          if [ -f TMessagesProj/google-services.json ]; then
            cp TMessagesProj/google-services.json TMessagesProj_App/google-services.json
          fi
          test -f TMessagesProj_App/google-services.json || { echo "::error::google-services.json missing"; exit 1; }

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p TMessagesProj/config
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > TMessagesProj/config/release.keystore
            echo "RELEASE_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "Using your release keystore."
          else
            echo "::warning::Signing secrets not set, using a temporary key. Updates will not install over APKs signed with a different key."
            rm -f TMessagesProj/config/release.keystore
            keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore -storepass omnigram123 -keypass omnigram123 \
              -alias omnigram -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Omnigram"
            echo "RELEASE_STORE_PASSWORD=omnigram123" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=omnigram123" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=omnigram" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace --max-workers=2 \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g"

      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          mkdir -p dist
          APK="$(ls TMessagesProj_App/build/outputs/apk/afat/release/*.apk | grep -v unsigned | head -n 1 || true)"
          [ -n "$APK" ] || { echo "::error::No signed APK found (only unsigned?)"; ls -R TMessagesProj_App/build/outputs/apk || true; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" dist/Omnigram.apk
          ls -l dist

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: omnigram-apk
          path: dist/Omnigram.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub Release (download the raw .apk, not a zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/Omnigram.apk \
            --repo "${{ github.repository }}" \
            --title "Omnigram build ${{ github.run_number }}" \
            --notes "Signed APK from commit ${{ github.sha }}. Download Omnigram.apk and install it directly." \
            --latest
