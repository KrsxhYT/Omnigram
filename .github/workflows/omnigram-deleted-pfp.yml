name: Omnigram deleted+PFP+dev

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/omnigram_deleted_pfp_dev.py'
      - '.github/workflows/omnigram-deleted-pfp.yml'

permissions:
  contents: write

concurrency:
  group: omnigram-deleted-pfp
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply patches
        run: |
          set -euo pipefail
          python3 tools/omnigram_deleted_pfp_dev.py

      - name: Commit TMessagesProj only
        run: |
          set -euo pipefail
          git config user.name "omnigram-bot"
          git config user.email "bot@omnigram.local"
          git add TMessagesProj/ || true
          git reset HEAD -- .github 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Features: deleted dustbin like SS, PFP profile-settings sync, Developers UI"
            git push origin HEAD:master
          fi
